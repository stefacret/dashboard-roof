<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esploratore di Compatibilità: Stratigrafie Green Roof e Palette Naturalistiche</title>
    <style>
        :root {
            --bg-color: #12141c;
            --card-bg: #1a1d29;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --status-high: #10b981;
            --status-medium: #f59e0b;
            --status-low: #ef4444;
            --border-color: #2d3142;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            margin-top: 20px;
        }

        /* Form Controls */
        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .select-input {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: var(--accent-green);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .slider-input {
            flex-grow: 1;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .slider-value {
            font-size: 16px;
            font-weight: 700;
            min-width: 60px;
            text-align: right;
            color: var(--accent-green);
        }

        /* Status & Justification */
        .status-box {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid transparent;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-label {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }
